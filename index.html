<style>
:root{--bg:#f6f4f8;--card:#fff;--line:#e2dde8;--text:#1d1526;--muted:#6b6377;--acc:#3d195b;--live:#c0392b;--good:#137a4a;--warn:#b3541e;
  --club:#3d195b;--club2:#1d1526}
@media (prefers-color-scheme: dark){
  :root{--bg:#141019;--card:#1e1826;--line:#312a3b;--text:#efeaf4;--muted:#a79fb2;--live:#ff6b52;--good:#3fbc80;
        --acc:#c9a6ff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 60px}
header{padding:26px 0 16px;border-bottom:2px solid var(--club)}
.kicker{font-size:12px;letter-spacing:.22em;color:var(--club);text-transform:uppercase;font-weight:700}
h1{margin:6px 0 4px;font-size:30px;font-weight:900;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:13.5px}
/* team picker */
.picker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:16px 0 4px;background:var(--card);border:1px solid var(--line);border-left:4px solid var(--club);border-radius:12px;padding:12px 14px}
.picker label{font-size:13px;color:var(--muted)}
.picker select{background:var(--bg);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:15px;font-weight:700;padding:7px 10px}
.picker .tz{font-size:12.5px;color:var(--muted);margin-left:auto}
/* hero */
.hero{position:relative;overflow:hidden;border-radius:16px;padding:20px 22px;margin:16px 0 4px;
  background:linear-gradient(135deg,var(--club) 0%,color-mix(in srgb,var(--club) 55%,#120a18) 100%);color:#fff;
  box-shadow:0 6px 22px -10px rgba(0,0,0,.5)}
.hero .lbl{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;opacity:.82;font-weight:700}
.hero .vs{display:flex;align-items:center;gap:10px;margin:12px 0 4px;max-width:470px}
.hero .cl{display:flex;align-items:center;gap:8px;font-size:18px;font-weight:800;min-width:0;flex:1}
.hero .cl:last-of-type{justify-content:flex-end;text-align:right}
.hero .cl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hero .cl img{width:34px;height:34px;flex:0 0 auto;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
.hero .sep{flex:0 0 auto}
.hero .sep{opacity:.6;font-size:13px;font-weight:700;letter-spacing:.1em}
.hero .when{font-size:14px;opacity:.95;margin-top:7px}
.hero .cd{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:13px;max-width:340px}
.hero .cd div{background:rgba(255,255,255,.16);border-radius:10px;padding:7px 6px;text-align:center;backdrop-filter:blur(3px)}
.hero .cd b{display:block;font-size:22px;font-weight:900;font-variant-numeric:tabular-nums;line-height:1.15}
.hero .cd span{font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.hero .tag{display:inline-block;margin-top:12px;background:rgba(255,255,255,.2);border-radius:999px;
  padding:5px 12px;font-size:12px;font-weight:700}
.hero .go2{position:absolute;inset:0;border:0;background:none;cursor:pointer}
.hero.livenow{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 6px 22px -10px rgba(0,0,0,.5)}50%{box-shadow:0 6px 30px -6px rgba(220,30,30,.75)}}
.streak{font-size:13px;opacity:.95;margin-top:9px}
.season{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 16px;margin:12px 0 4px}
.season .sl{display:flex;justify-content:space-between;gap:12px;font-size:12.5px;color:var(--muted);margin-bottom:7px;flex-wrap:wrap}
.season .sl b{color:var(--text)}
.season .track{position:relative;height:9px;background:var(--bg);border-radius:5px;overflow:hidden}
.season .fill{height:100%;background:var(--club);border-radius:5px}
.season .foot{display:flex;justify-content:space-between;gap:12px;font-size:12px;color:var(--muted);margin-top:7px;flex-wrap:wrap}
.season .foot b{color:var(--club)}
/* tabs */
nav{display:flex;gap:6px;margin:18px 0 16px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:8px 16px;font-size:13.5px;cursor:pointer}
nav button.on{background:var(--club);color:#fff;border-color:var(--club);font-weight:700}
nav button{transition:background .15s,color .15s,border-color .15s}
nav button:hover{border-color:var(--club)}
.m{transition:border-color .12s,transform .12s}
.m:hover{border-color:var(--club)}
.chipbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px}
.chipbar button{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 12px;font-size:12.5px;cursor:pointer}
.chipbar button.on{background:var(--club);color:#fff;border-color:var(--club);font-weight:700}
/* table */
table{width:100%;border-collapse:collapse;background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
th{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:right;padding:10px 6px;font-weight:700;border-bottom:1px solid var(--line)}
th:nth-child(2){text-align:left}
td{padding:9px 6px;text-align:right;font-size:14px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--line)}
td:nth-child(2){text-align:left}
tr:last-child td{border-bottom:0}
tr.me td{background:color-mix(in srgb,var(--club) 9%,#fff);font-weight:700}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--club)}
.cl td:first-child{box-shadow:inset 3px 0 0 var(--good)}
.rel td:first-child{box-shadow:inset 3px 0 0 var(--live)}
tr.me.cl td:first-child,tr.me.rel td:first-child{box-shadow:inset 3px 0 0 var(--acc)}
.tm{display:flex;align-items:center;gap:8px;min-width:0}
.tm img{width:22px;height:22px;flex:0 0 auto}
.tm span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-weight:800}
.scorers{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:18px}
.scorers h3{margin:0 0 10px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.sc1{display:flex;align-items:center;gap:9px;font-size:14px;padding:6px 0;border-top:1px solid var(--line)}
.sc1:first-of-type{border-top:0}
.sc1 .r{color:var(--muted);width:16px;font-variant-numeric:tabular-nums;flex:0 0 auto;font-size:12px}
.sc1 img{width:18px;height:18px;flex:0 0 auto}
.sc1 .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc1 .g{font-weight:800;font-variant-numeric:tabular-nums;color:var(--club)}
.sc1 .cup{color:var(--muted);font-size:11px;font-weight:600}
.nx{display:flex;align-items:center;gap:5px;justify-content:flex-end;font-size:11.5px;color:var(--muted)}
.nx img{width:16px;height:16px}
.el td:first-child{box-shadow:inset 3px 0 0 #d98324}
.key{font-size:12px;color:var(--muted);margin-top:10px;display:flex;gap:16px;flex-wrap:wrap}
.key i{font-style:normal;display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:middle}
/* fixtures */
.day{margin:22px 0 8px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--club);border-bottom:1px solid var(--line);padding-bottom:4px;font-weight:700}
.m{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin-bottom:7px;display:flex;align-items:center;gap:10px}
.m.me{border-left:3px solid var(--club)}
.m.live{border-left:3px solid var(--live)}
.m .side{flex:1;display:flex;align-items:center;gap:7px;min-width:0;font-size:14.5px}
.m .side.a{justify-content:flex-end;text-align:right}
.m .side img{width:20px;height:20px;flex:0 0 auto}
.m .side span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m .sc{font-weight:800;font-variant-numeric:tabular-nums;font-size:15px;min-width:52px;text-align:center}
.m .tm2{color:var(--muted);font-size:12.5px;min-width:52px;text-align:center;font-variant-numeric:tabular-nums}
.m .w{font-weight:800}
.m .clock{color:var(--live);font-size:11px;font-weight:700}
.m{cursor:pointer}
:focus-visible{outline:2px solid var(--club);outline-offset:2px;border-radius:8px}
.m .go{color:var(--muted);font-size:11px;flex:0 0 auto;width:12px;text-align:center}
.cal{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 11px;color:var(--text);text-decoration:none;background:var(--card);cursor:pointer;margin:0 6px 8px 0}
.cal:hover{border-color:var(--club);color:var(--text)}
.detail{background:var(--card);border:1px solid var(--line);border-top:0;border-radius:0 0 10px 10px;padding:12px 14px;margin:-7px 0 8px}
.detail h4{margin:0 0 8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.xi{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.xi .side h5{margin:0 0 5px;font-size:13.5px;font-weight:800}
.xi .side .form{font-size:11px;color:var(--muted);font-weight:600}
.xi .p{font-size:13px;padding:2.5px 0;display:flex;gap:7px;border-top:1px solid var(--line)}
.xi .p .no{color:var(--muted);width:20px;flex:0 0 auto;font-variant-numeric:tabular-nums;text-align:right}
.xi .p .po{color:var(--muted);font-size:11px;margin-left:auto;flex:0 0 auto}
.xi .subs{margin-top:6px;font-size:11.5px;color:var(--muted);line-height:1.5}
.sbar{display:flex;align-items:center;gap:9px;font-size:12.5px;padding:3px 0}
.sbar .lv,.sbar .rv{width:38px;font-variant-numeric:tabular-nums;flex:0 0 auto}
.sbar .rv{text-align:right}
.sbar .nm{width:112px;color:var(--muted);text-align:center;flex:0 0 auto;font-size:11px}
.sbar .t{flex:1;display:flex;height:7px;border-radius:4px;overflow:hidden;background:var(--bg)}
.sbar .t i{display:block}.sbar .t .l{background:var(--club)}.sbar .t .r{background:#9b93a6}
.hlgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.hlc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px;cursor:pointer;text-align:left}
.hlc:hover{border-color:var(--club)}
.hlthumb{position:relative;border-radius:8px;overflow:hidden;background:#ddd8e2}
.hlthumb img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block}
.hlplay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(20,10,26,.28);color:#fff;font-size:26px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
.hlc .hls{font-size:13.5px;font-weight:800;margin-top:8px;display:flex;align-items:center;gap:6px}
.hlc .hls img{width:17px;height:17px}
.hlc .hlt{font-size:11.5px;color:var(--muted);margin-top:3px;line-height:1.4}
.hlc .rnd{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;
  background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted);margin-left:4px}
.hlday{grid-column:1/-1;margin:6px 0 -4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--club);font-weight:700}
.ovl{position:fixed;inset:0;background:rgba(14,8,18,.88);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.ovl .box{width:min(900px,96vw)}
.ovl .bh{display:flex;justify-content:space-between;align-items:center;color:#fff;font-weight:800;font-size:15px;margin-bottom:9px;gap:12px}
.ovl .bh button{background:none;border:0;color:#fff;font-size:26px;cursor:pointer;line-height:1;
  min-width:44px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;margin:-8px -8px -8px 0}
.ovl .fr{aspect-ratio:16/9;width:100%}
.ovl iframe{width:100%;height:100%;border:0;border-radius:12px;background:#000}
.playbtn{border:0;background:none;color:var(--club);font-size:15px;cursor:pointer;
  flex:0 0 auto;min-width:44px;min-height:44px;margin:-8px -6px -8px 0;
  display:inline-flex;align-items:center;justify-content:center}
.wx{display:inline-flex;align-items:center;gap:7px;background:var(--bg);border:1px solid var(--line);
  border-radius:9px;padding:6px 11px;font-size:13px;margin:0 0 9px}
.wx b{font-weight:800}
.wx .wsub{color:var(--muted);font-size:11.5px}
.hero .wxh{display:inline-block;margin-top:9px;margin-left:6px;background:rgba(255,255,255,.2);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:700}
.sqgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:14px}
.sqp{font-size:13px;padding:3px 0;display:flex;gap:8px;border-top:1px solid var(--line)}
.sqp .no{color:var(--muted);width:22px;text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums}
.sqp .ag{color:var(--muted);margin-left:auto;font-size:11px;flex:0 0 auto}
.sqcol h5{margin:0 0 5px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--club)}
.clubcell{cursor:pointer}
.clubcell:hover span{text-decoration:underline}
.h2h{display:flex;gap:2px;height:22px;border-radius:6px;overflow:hidden;margin:2px 0 8px;font-size:10.5px;font-weight:800}
.h2h div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;white-space:nowrap;overflow:hidden}
.h2h .a{background:var(--club)}.h2h .d{background:#9b93a6}.h2h .b{background:#6b6377}
.h2hl{font-size:12px;color:var(--muted);margin-bottom:8px}
.h2hm{font-size:12.5px;padding:3px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.h2hm .ss{color:var(--muted);width:52px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:10px;margin-top:4px}
.vcard{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:7px;cursor:pointer;text-align:left;overflow:hidden}
.vcard:hover{border-color:var(--club)}
.vcard img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:7px;background:#ddd8e2;display:block}
.vcard .vt{font-size:12px;font-weight:700;margin-top:6px;line-height:1.35}
.vcard .vd{font-size:11px;color:var(--muted);margin-top:2px}
.vplay{width:100%;border-radius:10px;background:#000;margin-top:6px}
.ev{font-size:13px;padding:3px 0;border-top:1px solid var(--line);display:flex;gap:8px}
.ev .mn{color:var(--muted);width:34px;flex:0 0 auto;font-variant-numeric:tabular-nums}
.formpill{display:inline-flex;gap:2px}
.formpill i{width:15px;height:15px;border-radius:3px;font-style:normal;font-size:9.5px;font-weight:800;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.formpill .fw{background:#137a4a}.formpill .fd{background:#9b93a6}.formpill .fl{background:#c0392b}
.tv{font-size:10px;font-weight:700;color:var(--muted);background:var(--bg);border:1px solid var(--line);
  border-radius:5px;padding:2px 6px;white-space:nowrap;flex:0 1 auto;min-width:0;
  max-width:104px;overflow:hidden;text-overflow:ellipsis}
@media(max-width:560px){.tv{max-width:56px}}
.cbadge{font-size:9.5px;letter-spacing:.07em;font-weight:800;text-transform:uppercase;border-radius:4px;padding:2px 5px;background:var(--bg);border:1px solid var(--line);color:var(--muted);flex:0 0 auto}
.cbadge.ucl{background:#e0e9f7;color:#1a4a8a}.cbadge.fa{background:#fbe8e4;color:#a8341c}.cbadge.efl{background:#e6f0e8;color:#1c6b45}
.odds{display:flex;gap:1px;margin:0 0 7px;border-radius:0 0 9px 9px;overflow:hidden;height:20px;font-size:10px;font-weight:700}
.odds div{display:flex;align-items:center;justify-content:center;color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.odds .oh{background:#4a2a6b}.odds .od{background:#9b93a6}.odds .oa{background:#6b4a8a}
.owrap{margin-bottom:7px}
.owrap .m{margin-bottom:0;border-radius:10px 10px 0 0}
.olab{font-size:11px;color:var(--muted);margin:-2px 0 9px;padding-left:2px}
.olab a{color:var(--muted)}
.more{display:block;width:100%;margin:14px 0;padding:11px;background:var(--card);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:14px;font-weight:700;cursor:pointer}
.more:hover{border-color:var(--club)}
/* kickoff times */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:20px}
.c{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.c .n{font-size:30px;font-weight:900;line-height:1.1;color:var(--club);font-variant-numeric:tabular-nums}
.c .l{font-size:12.5px;color:var(--muted);margin-top:3px}
.bars{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.bar{display:flex;align-items:center;gap:10px;padding:2.5px 0;font-size:13px}
.bar .h{width:76px;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.bar .t{flex:1;background:var(--bg);border-radius:4px;overflow:hidden;height:17px}
.bar .f{height:100%;background:var(--club);border-radius:4px;min-width:2px}
.bar .f.dim{background:#c3b6d2}
.bar .v{width:26px;text-align:right;color:var(--muted);flex:0 0 auto;font-variant-numeric:tabular-nums}
.note{font-size:13px;color:var(--muted);margin:12px 0 0;line-height:1.55}
footer{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted)}
footer a{color:var(--club)}
@media (prefers-color-scheme: dark){footer a,.saybox a{color:#c9a6ff}}
.saybox{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px}
.saybox .gh{display:inline-block;margin-top:10px;background:var(--club);color:#fff;text-decoration:none;border-radius:9px;padding:9px 15px;font-size:14px;font-weight:700}
.saybox .fine{font-size:12.5px;color:var(--muted);margin-top:12px}
.err{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--live);border-radius:10px;padding:14px}
@media(max-width:430px){
  /* at ~340px the two crests plus the V leave ~66px per club, which truncates
     "Man United". Stack the matchup instead of shrinking it to nothing. */
  .hero .vs{flex-direction:column;align-items:stretch;gap:4px;max-width:100%}
  .hero .cl{flex:none;justify-content:flex-start;text-align:left}
  .hero .cl:last-of-type{justify-content:flex-start;text-align:left}
  .hero .cl:last-of-type{flex-direction:row-reverse;justify-content:flex-end}
  .hero .sep{align-self:flex-start;margin-left:2px;opacity:.55}
  .hero .cd{grid-template-columns:repeat(4,1fr);gap:6px}
  .hero .cd b{font-size:19px}
}
@media(pointer:coarse),(max-width:560px){
  /* 44px minimum touch target — measured 34px tabs / 32px buttons before this */
  nav button{min-height:44px;padding:10px 16px}
  .picker select{min-height:44px}
  .cal{min-height:44px;display:inline-flex;align-items:center;padding:0 13px}
  .clubcell{min-height:44px}
  .more{min-height:48px}
  .hlc,.vcard{padding:10px}
}
@media(max-width:560px){
  .m .go{display:none}          /* decoration; the whole row is already tappable */
  .m .tv{display:none}          /* shown in the hero and in the match panel instead */
  .m{gap:7px}
  h1{font-size:24px}
  .hide-s{display:none}
  .m .side span{font-size:13px}
  .picker .tz{margin-left:0;width:100%}
}
/* Dark-mode component overrides live HERE, after the rules they override.
   Declared earlier they lose the cascade at equal specificity — that is how the
   followed club's table row ended up white text on a near-white background. */
@media (prefers-color-scheme: dark){
  tr.me td{background:color-mix(in srgb,var(--club) 26%,#1e1826)}
  .sbar .t,.bar .t{background:#2a2333}
  .formpill .fd{background:#6b6377}
  .cbadge{background:#241d2e}
  .wx,.tv{background:#241d2e}
}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="kicker">English Premier League</div>
  <h1>Premier League Tracker</h1>
  <div class="sub" id="sub">Loading…</div>
</header>

<div class="picker">
  <label for="team">My club</label>
  <select id="team"></select>
  <span class="tz" id="tz"></span>
</div>

<div id="hero"></div>
<div id="season"></div>

<nav>
  <button data-t="table" class="on">Table</button>
  <button data-t="fix">Fixtures</button>
  <button data-t="tz">My Kickoff Times</button>
  <button data-t="hl">Highlights</button>
  <button data-t="about">About</button>
</nav>

<main id="view"><p class="sub">Loading…</p></main>

<footer>
  Schedule from <a href="https://github.com/openfootball/football.json">openfootball</a> (CC0).
  Table &amp; results from ESPN's public feed. Times shown in your browser's timezone.
  <span id="upd"></span>
</footer>
</div>

<script>
var D = null, SCORERS = null, HL = null, HIST = null, TEAM = localStorage.getItem('epl.team') || 'manchesterunited', TAB = 'table', showAll = false, showPast = false;
var TZ = Intl.DateTimeFormat().resolvedOptions().timeZone || 'your timezone';
var view = document.getElementById('view');

function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function team(k){ return D.teams[k] || {name:k, short:k, abbr:'', logo:''}; }
function crest(k, big){ var t = team(k);
  return t.logo ? '<img src="'+esc(t.logo)+'" alt="" loading="lazy" width="'+(big?34:22)+'" height="'+(big?34:22)+'">' : ''; }
function dt(m){ return new Date(m.utc.replace('Z',':00Z')); }

var fDay = new Intl.DateTimeFormat([], {weekday:'long', month:'short', day:'numeric'});
var fTime = new Intl.DateTimeFormat([], {hour:'numeric', minute:'2-digit'});

/* ---------- form guide (computed from our own results — no extra request) ---------- */
function formOf(k, n){
  var out = [];
  D.matches.forEach(function(m){
    if (m.c !== 'PL' || !m.done || m.hs == null) return;
    if (m.h !== k && m.a !== k) return;
    var gf = m.h === k ? m.hs : m['as'], ga = m.h === k ? m['as'] : m.hs;
    out.push(gf > ga ? 'W' : gf < ga ? 'L' : 'D');
  });
  return out.slice(-(n || 5));
}
function formPill(k){
  var f = formOf(k, 5);
  if (!f.length) return '<span class="dim" style="color:var(--muted)">–</span>';
  return '<span class="formpill">' + f.map(function(r){
    return '<i class="f'+r.toLowerCase()+'" title="'+r+'">'+r+'</i>'; }).join('') + '</span>';
}

function nextOpp(k){
  var now = Date.now();
  var m = D.matches.filter(function(x){
    return (x.h === k || x.a === k) && !x.done && dt(x).getTime() > now - 7200000; })[0];
  if (!m) return '<span style="color:var(--muted)">–</span>';
  var opp = m.h === k ? m.a : m.h;
  return '<div class="nx" title="'+esc(team(opp).name)+(m.h===k?' (H)':' (A)')+'">'
       + crest(opp) + '<span>'+(m.h === k ? 'H' : 'A')+'</span></div>';
}

function scorersBlock(){
  if (!SCORERS) return '';
  var byId = {};
  Object.keys(D.teams).forEach(function(k){ if (D.teams[k].id) byId[D.teams[k].id] = k; });
  var list = Object.keys(SCORERS.players || {}).map(function(k){ return SCORERS.players[k]; })
    .filter(function(p){ return (p.l || 0) > 0; })
    .sort(function(a, b){ return (b.l - a.l) || (b.g - a.g) || a.n.localeCompare(b.n); })
    .slice(0, 10);
  if (!list.length) return '';
  return '<div class="scorers"><h3>Top scorers \u00b7 Premier League</h3>'
    + list.map(function(p, i){
        var k = byId[p.t], extra = p.g > p.l ? ' <span class="cup">+'+(p.g - p.l)+' in cups</span>' : '';
        return '<div class="sc1"><span class="r">'+(i+1)+'</span>'
             + (k ? crest(k) : '')
             + '<span class="nm">'+esc(p.n)+extra+'</span>'
             + '<span class="g">'+p.l+'</span></div>';
      }).join('')
    + '</div>';
}

/* ---------- table ---------- */
function renderTable(){
  var rows = D.table.map(function(r){
    var t = team(r.t), cls = [];
    if (r.t === TEAM) cls.push('me');
    if (r.rank <= 4) cls.push('cl');
    else if (r.rank <= 6) cls.push('el');
    else if (r.rank >= 18) cls.push('rel');
    return '<tr class="'+cls.join(' ')+'">'
      + '<td>'+r.rank+'</td>'
      + '<td><div class="tm clubcell" data-squad="'+esc(r.t)+'" title="See the squad"'
      +   ' tabindex="0" role="button" aria-label="'+esc(t.name)+' squad">'
      +   crest(r.t)+'<span>'+esc(t.short)+'</span></div></td>'
      + '<td>'+r.pld+'</td>'
      + '<td class="hide-s">'+r.w+'</td><td class="hide-s">'+r.d+'</td><td class="hide-s">'+r.l+'</td>'
      + '<td class="hide-s">'+r.gf+'</td><td class="hide-s">'+r.ga+'</td>'
      + '<td>'+(r.gd > 0 ? '+' : '')+r.gd+'</td>'
      + '<td class="hide-s">'+formPill(r.t)+'</td>'
      + '<td class="hide-s">'+nextOpp(r.t)+'</td>'
      + '<td class="pts">'+r.pts+'</td></tr>';
  }).join('');
  view.innerHTML = '<table><thead><tr><th>#</th><th>Club</th><th>Pl</th>'
    + '<th class="hide-s">W</th><th class="hide-s">D</th><th class="hide-s">L</th>'
    + '<th class="hide-s">GF</th><th class="hide-s">GA</th><th>GD</th><th class="hide-s">Form</th><th class="hide-s">Next</th><th>Pts</th></tr></thead>'
    + '<tbody>'+rows+'</tbody></table>'
    + '<div class="key"><span><i style="background:#137a4a"></i>Champions League</span>'
    + '<span><i style="background:#d98324"></i>Europa</span>'
    + '<span><i style="background:#c0392b"></i>Relegation</span></div>'
    + scorersBlock();
  view.onclick = function(ev){
    var c = ev.target.closest ? ev.target.closest('[data-squad]') : null;
    if (c) openSquad(c.dataset.squad);
  };
}

/* ---------- calendar ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function icsStamp(d){
  return d.getUTCFullYear() + pad(d.getUTCMonth()+1) + pad(d.getUTCDate()) + 'T'
       + pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + '00Z';
}
function icsEsc(t){ return String(t).replace(/\\/g,'\\\\').replace(/[,;]/g,'\\$&').replace(/\n/g,' '); }
function icsFor(list, name){
  var lines = ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//epl-tracker//EN','CALSCALE:GREGORIAN','METHOD:PUBLISH',
               'X-WR-CALNAME:' + icsEsc(name)];
  list.forEach(function(m){
    var st = dt(m), en = new Date(st.getTime() + 2*60*60*1000);
    var title = team(m.h).name + ' v ' + team(m.a).name + (m.c && m.c !== 'PL' ? ' (' + (COMP[m.c]||m.c) + ')' : '');
    lines.push('BEGIN:VEVENT',
      'UID:' + (m.e || (m.h + m.a + m.utc)) + '@epl-tracker',
      'DTSTAMP:' + icsStamp(new Date(D.updated)),
      'DTSTART:' + icsStamp(st), 'DTEND:' + icsStamp(en),
      'SUMMARY:' + icsEsc(title),
      'DESCRIPTION:' + icsEsc(m.c === 'PL' ? 'Premier League matchday ' + m.md : (COMP[m.c]||m.c)),
      'END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  return lines.join('\r\n');
}
function downloadICS(list, name, file){
  var blob = new Blob([icsFor(list, name)], {type:'text/calendar;charset=utf-8'});
  var url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = file; document.body.appendChild(a); a.click();
  document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
}
function gcalLink(m){
  var st = dt(m), en = new Date(st.getTime() + 2*60*60*1000);
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE'
    + '&text=' + encodeURIComponent(team(m.h).name + ' v ' + team(m.a).name)
    + '&dates=' + icsStamp(st) + '/' + icsStamp(en)
    + '&details=' + encodeURIComponent(m.c === 'PL' ? 'Premier League matchday ' + m.md : (COMP[m.c]||m.c));
}

/* ---------- head-to-head, from 16 seasons of openfootball ---------- */
// 78KB, and only ever wanted once a match is opened — so it is fetched on first use,
// never on page load.
var histWanted = false, histQueue = [];
function loadHistory(then){
  if (HIST){ then(); return; }
  histQueue.push(then);              // queue, don't drop: a second caller was losing its callback
  if (histWanted) return;
  histWanted = true;
  function drain(){ var q = histQueue; histQueue = []; q.forEach(function(f){ f(); }); }
  getJSON('history.json').then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ HIST = j || {pairs:{}}; drain(); })
    .catch(function(){ HIST = {pairs:{}}; drain(); });
}

function h2hBlock(m){
  if (!HIST) return '<h4>Head to head</h4><p class="note" style="margin:0">Loading\u2026</p>';
  var rec = (HIST.pairs || {})[[m.h, m.a].sort().join('|')];
  if (!rec || !rec.n) return '';
  var hw = (rec.w || {})[m.h] || 0, aw = (rec.w || {})[m.a] || 0, dr = rec.d || 0;
  var tot = hw + aw + dr || 1;
  var pct = function(x){ return Math.round(x / tot * 100); };
  var rows = (rec.last || []).slice().reverse().map(function(x){
    return '<div class="h2hm"><span class="ss">'+esc(x.s)+'</span>'
         + '<span>'+esc(team(x.h).short)+' <b>'+x.hs+'\u2013'+x['as']+'</b> '+esc(team(x.a).short)+'</span></div>';
  }).join('');
  return '<h4>Head to head \u00b7 last '+HIST.seasons+' seasons</h4>'
    + '<div class="h2h">'
    +   '<div class="a" style="width:'+pct(hw)+'%">'+(pct(hw) >= 14 ? hw+' W' : '')+'</div>'
    +   '<div class="d" style="width:'+pct(dr)+'%">'+(pct(dr) >= 14 ? dr+' D' : '')+'</div>'
    +   '<div class="b" style="width:'+pct(aw)+'%">'+(pct(aw) >= 14 ? aw+' W' : '')+'</div>'
    + '</div>'
    + '<div class="h2hl">'+esc(team(m.h).short)+' '+hw+' \u00b7 '+dr+' draws \u00b7 '
    +   aw+' '+esc(team(m.a).short)+' \u2014 '+rec.n+' league meetings since '+esc(HIST.from)+'</div>'
    + rows;
}

/* ---------- kickoff weather (Open-Meteo, no key; ~16 days of forecast) ---------- */
var wxCache = {};
var WXC = {0:['Clear','\u2600\ufe0f'],1:['Mainly clear','\ud83c\udf24\ufe0f'],2:['Partly cloudy','\u26c5'],
  3:['Overcast','\u2601\ufe0f'],45:['Fog','\ud83c\udf2b\ufe0f'],48:['Fog','\ud83c\udf2b\ufe0f'],
  51:['Light drizzle','\ud83c\udf26\ufe0f'],53:['Drizzle','\ud83c\udf26\ufe0f'],55:['Heavy drizzle','\ud83c\udf26\ufe0f'],
  61:['Light rain','\ud83c\udf27\ufe0f'],63:['Rain','\ud83c\udf27\ufe0f'],65:['Heavy rain','\ud83c\udf27\ufe0f'],
  71:['Light snow','\ud83c\udf28\ufe0f'],73:['Snow','\ud83c\udf28\ufe0f'],75:['Heavy snow','\ud83c\udf28\ufe0f'],
  80:['Showers','\ud83c\udf26\ufe0f'],81:['Showers','\ud83c\udf27\ufe0f'],82:['Heavy showers','\ud83c\udf27\ufe0f'],
  95:['Thunderstorm','\u26c8\ufe0f'],96:['Thunderstorm','\u26c8\ufe0f'],99:['Thunderstorm','\u26c8\ufe0f']};

function wxEligible(m){
  if (m.done || !m.v || !(D.venues || {})[m.v]) return false;
  var days = (dt(m).getTime() - Date.now()) / 86400000;
  return days > -0.2 && days < 15;              // Open-Meteo forecasts about 16 days
}

function loadWx(m, then){
  if (!wxEligible(m)) { then(null); return; }
  var c = (D.venues || {})[m.v], day = m.utc.slice(0, 10);
  var ckey = m.v + day + m.utc.slice(11, 13);
  if (wxCache[ckey] !== undefined){ then(wxCache[ckey]); return; }
  fetch('https://api.open-meteo.com/v1/forecast?latitude='+c[0]+'&longitude='+c[1]
      + '&hourly=temperature_2m,precipitation_probability,weather_code&start_date='+day
      + '&end_date='+day+'&timezone=UTC')
    .then(function(r){ return r.json(); })
    .then(function(j){
      var h = j.hourly || {}, want = m.utc.slice(0, 13) + ':00';
      var i = (h.time || []).indexOf(want);
      if (i < 0){ wxCache[ckey] = null; then(null); return; }
      wxCache[ckey] = {t: Math.round(h.temperature_2m[i]), p: h.precipitation_probability[i],
                       c: h.weather_code[i]};
      then(wxCache[ckey]);
    })
    .catch(function(){ wxCache[ckey] = null; then(null); });
}

function wxHtml(w, venue){
  if (!w) return '';
  var d = WXC[w.c] || ['', '\ud83c\udf21\ufe0f'];
  var f = Math.round(w.t * 9 / 5 + 32);
  return '<div class="wx"><span>'+d[1]+'</span><b>'+w.t+'\u00b0C / '+f+'\u00b0F</b>'
    + '<span class="wsub">'+esc(d[0])+' \u00b7 '+w.p+'% rain'
    + (venue ? ' \u00b7 '+esc(venue) : '')+'</span></div>';
}

/* ---------- match detail: lineups, stats, key events (fetched on click) ---------- */
var detailCache = {};
function statBar(name, l, r){
  var ln = parseFloat(l) || 0, rn = parseFloat(r) || 0, tot = ln + rn;
  var lp = tot ? Math.round(ln/tot*100) : 50;
  return '<div class="sbar"><div class="lv">'+esc(l)+'</div>'
    + '<div class="t"><i class="l" style="width:'+lp+'%"></i><i class="r" style="width:'+(100-lp)+'%"></i></div>'
    + '<div class="rv">'+esc(r)+'</div><div class="nm">'+esc(name)+'</div></div>';
}
var STATS = [['possessionPct','Possession'],['totalShots','Shots'],['shotsOnTarget','On target'],
             ['wonCorners','Corners'],['foulsCommitted','Fouls'],['yellowCards','Yellows']];

function renderDetail(m, box){
  var d = detailCache[m.e];
  if (d === 'error'){ box.innerHTML = '<div class="detail">Could not load match detail.</div>'; return; }
  if (!d){ box.innerHTML = '<div class="detail">Loading…</div>'; return; }

  var html = '<div class="detail">';

  // calendar row — always available, even before a lineup exists
  if (m.tv) html += '<div class="wx" style="margin-bottom:9px">\ud83d\udcfa <b>'
                  + esc(m.tv.join(' / ')) + '</b><span class="wsub">US broadcast</span></div>';
  html += '<a class="cal" id="ics-'+m.e+'">＋ Add to calendar (.ics)</a>'
        + '<a class="cal" href="'+esc(gcalLink(m))+'" target="_blank" rel="noopener noreferrer">＋ Google Calendar</a>'
        + '<a class="cal" id="shr-'+m.e+'">↗ Share card</a>'
        + '<a class="cal" id="sqh-'+m.e+'">👥 Squads</a>';

  html += '<div id="wx-'+m.e+'"></div>' + h2hBlock(m);

  var rs = d.rosters || [];
  if (rs.length === 2 && (rs[0].roster || []).length){
    html += '<h4>Lineups</h4><div class="xi">';
    rs.forEach(function(t){
      var players = t.roster || [];
      var xi = players.filter(function(p){ return p.starter; });
      var subs = players.filter(function(p){ return !p.starter; });
      html += '<div class="side"><h5>'+esc((t.team||{}).displayName||'')+'</h5>'
            + '<div class="form">'+esc(t.formation || '')+'</div>';
      xi.forEach(function(p){
        var a = p.athlete || {};
        html += '<div class="p"><span class="no">'+esc(p.jersey||'')+'</span>'
              + '<span>'+esc(a.displayName||'')+'</span>'
              + '<span class="po">'+esc((p.position||{}).abbreviation||'')+'</span></div>';
      });
      if (subs.length) html += '<div class="subs"><b>Bench:</b> '
            + subs.map(function(p){ return esc((p.athlete||{}).displayName||''); }).join(', ') + '</div>';
      html += '</div>';
    });
    html += '</div>';
  } else {
    html += '<h4>Lineups</h4><p class="note" style="margin:0">Lineups are published about an hour before kickoff.</p>';
  }

  var bt = (d.boxscore || {}).teams || [];
  if (bt.length === 2){
    var get = function(t, n){
      var st = (t.statistics || []).filter(function(x){ return x.name === n; })[0];
      return st ? st.displayValue : null;
    };
    var rows = STATS.map(function(p){
      var l = get(bt[0], p[0]), r = get(bt[1], p[0]);
      return (l == null && r == null) ? '' : statBar(p[1], l == null ? '–' : l, r == null ? '–' : r);
    }).join('');
    if (rows.replace(/\s/g,'')) html += '<h4>Match stats</h4>' + rows;
  }

  var ke = (d.keyEvents || []).filter(function(e){
    var ty = ((e.type || {}).text || '').toLowerCase();
    return ty.indexOf('goal') > -1 || ty.indexOf('card') > -1;
  });
  if (ke.length){
    html += '<h4>Key events</h4>';
    ke.forEach(function(e){
      var who = (e.participants || []).map(function(p){ return ((p.athlete||{}).displayName)||''; })
                 .filter(Boolean).join(', ');
      html += '<div class="ev"><span class="mn">'+esc(((e.clock||{}).displayValue)||'')+'</span>'
            + '<span>'+esc((e.type||{}).text||'')+(who ? ' — ' + esc(who) : '')+'</span></div>';
    });
  }

  var vids = (d.videos || []).filter(function(v){ return v.thumbnail; });
  if (vids.length){
    html += '<h4>Video'+(m.done ? '' : ' &amp; build-up')+'</h4><div class="vids">';
    vids.slice(0, 6).forEach(function(v, i){
      var src = ((v.links || {}).source || {});
      var href = (src.HD && src.HD.href) || (src.full && src.full.href) || src.href || '';
      var web = ((v.links || {}).web || {}).href || '';
      var mins = v.duration ? Math.floor(v.duration/60)+':'+('0'+(v.duration%60)).slice(-2) : '';
      // ESPN ships 1920x1080 thumbs (~160KB). Their resizer serves the same frame at ~17KB.
      var thumb = 'https://a.espncdn.com/combiner/i?img=' + encodeURIComponent(v.thumbnail) + '&w=360';
      html += '<div class="vcard" data-v="'+i+'" data-src="'+esc(href)+'" data-web="'+esc(web)+'">'
            + '<img src="'+esc(thumb)+'" alt="" loading="lazy" decoding="async" width="360" height="203">'
            + '<div class="vt">'+esc(v.headline || 'Clip')+'</div>'
            + '<div class="vd">'+esc(mins)+'</div></div>';
    });
    html += '</div><div class="olab">Clips come from ESPN. Full match highlights are rights-restricted, '
          + 'so what appears here is ESPN\'s own match video and reaction.</div>';
  }

  html += '</div>';
  box.innerHTML = html;

  // click a thumbnail -> play inline, falling back to ESPN's page if the file will not stream
  // never hand window.open a URL from a feed without checking the scheme
  function safeOpen(u){ if (/^https?:\/\//i.test(u || '')) window.open(u, '_blank', 'noopener'); }
  [].slice.call(box.querySelectorAll('.vcard')).forEach(function(card){
    card.onclick = function(ev){
      ev.stopPropagation();
      var src = card.dataset.src, web = card.dataset.web;
      if (card.querySelector('video')) return;
      if (!src){ safeOpen(web); return; }
      if (!/^https?:\/\//i.test(src)) { safeOpen(web); return; }
      var v = document.createElement('video');
      v.src = src; v.controls = true; v.autoplay = true; v.className = 'vplay'; v.playsInline = true;
      v.onerror = function(){ safeOpen(web); };
      card.appendChild(v);
    };
  });

  loadWx(m, function(w){
    var slot = document.getElementById('wx-'+m.e);
    if (slot && w) slot.innerHTML = wxHtml(w, m.v);
  });

  var sb = document.getElementById('shr-'+m.e);
  if (sb) sb.onclick = function(e){ e.stopPropagation(); shareCard(m); };
  var sq = document.getElementById('sqh-'+m.e);
  if (sq) sq.onclick = function(e){ e.stopPropagation(); openSquad(m.h === TEAM ? m.a : m.h); };

  var btn = document.getElementById('ics-'+m.e);
  if (btn) btn.onclick = function(){
    downloadICS([m], team(m.h).short+' v '+team(m.a).short, 'match.ics');
  };
}

function openDetail(m, box){
  if (!m.e){ box.innerHTML = '<div class="detail">No match detail available for this fixture yet.</div>'; return; }
  renderDetail(m, box);
  if (!HIST) loadHistory(function(){ if (box.parentNode) renderDetail(m, box); });
  if (detailCache[m.e]) return;
  var path = (D.paths || {})[m.c || 'PL'] || 'eng.1';
  getJSON('https://site.api.espn.com/apis/site/v2/sports/soccer/'+path+'/summary?event='+encodeURIComponent(m.e))
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){ detailCache[m.e] = j; renderDetail(m, box); })
    .catch(function(){ detailCache[m.e] = 'error'; renderDetail(m, box); });
}

/* ---------- fixtures ---------- */
var COMP = {UCL:'Champions League', FA:'FA Cup', EFL:'EFL Cup'};
function matchRow(m){
  var d = dt(m), mine = (m.h === TEAM || m.a === TEAM);
  var hw = m.done && m.hs > m['as'], aw = m.done && m['as'] > m.hs;
  var hasScore = m.hs != null && m['as'] != null;   // must precede `mid`, which reads it
  var mid = (m.live && hasScore) ? '<div class="sc">'+m.hs+'\u2013'+m['as']+'<div class="clock">'+esc(m.clock||'LIVE')+'</div></div>'
          : (m.done && hasScore) ? '<div class="sc">'+m.hs+'\u2013'+m['as']+'</div>'
          : '<div class="tm2">'+fTime.format(d)+'</div>';
  var badge = m.c && m.c !== 'PL'
    ? '<span class="cbadge '+m.c.toLowerCase()+'" title="'+esc(COMP[m.c]||m.c)+'">'+esc(m.c)+'</span>' : '';
  var row = '<div class="m'+(mine?' me':'')+(m.live?' live':'')+'" data-i="'+m._i+'"'
    + ' tabindex="0" role="button" aria-label="'+esc(team(m.h).short+' versus '+team(m.a).short)+'">'
    + '<div class="side'+(hw?' w':'')+'">'+crest(m.h)+'<span>'+esc(team(m.h).short)+'</span></div>'
    + mid
    + '<div class="side a'+(aw?' w':'')+'"><span>'+esc(team(m.a).short)+'</span>'+crest(m.a)+'</div>'
    + badge
    + (m.note ? '<div class="tv" title="'+esc(m.note)+'">'+esc(m.note.replace(/ on penalties$/, ' on pens'))+'</div>' : '')
    + (m.tv ? '<div class="tv" title="US broadcast">'+esc(m.tv.join(' / '))+'</div>' : '')
    + (m.done ? '<button class="playbtn" data-play="'+m._i+'" title="'
        +(hlFor(m) ? 'Play official video' : 'Search YouTube for highlights')+'">\u25b6</button>' : '')
    + '<div class="go">\u203a</div>'
    + '</div>';

  if (!m.o) return row;
  // Kalshi implied probabilities. They carry an overround, so normalise to 100 for the bar.
  var tot = m.o[0] + m.o[1] + m.o[2] || 1;
  var pc = m.o.map(function(x){ return Math.round(x / tot * 100); });
  return '<div class="owrap">' + row
    + '<div class="odds" title="Market-implied chance, from Kalshi">'
    +   '<div class="oh" style="width:'+pc[0]+'%">'+(pc[0] >= 12 ? pc[0]+'%' : '')+'</div>'
    +   '<div class="od" style="width:'+pc[1]+'%">'+(pc[1] >= 12 ? 'draw '+pc[1]+'%' : '')+'</div>'
    +   '<div class="oa" style="width:'+pc[2]+'%">'+(pc[2] >= 12 ? pc[2]+'%' : '')+'</div>'
    + '</div></div>';
}

function renderFixtures(){
  var all = showAll ? D.matches : D.matches.filter(function(m){ return m.h === TEAM || m.a === TEAM; });
  var now = Date.now();

  // Land on the next match, not on August — unless the user asked for the whole season.
  var nextIdx = all.findIndex(function(m){ return !m.done && dt(m).getTime() > now - 7200000; });
  if (nextIdx < 0) nextIdx = all.length;
  var start = showPast ? 0 : Math.max(0, nextIdx - 3);

  var html = '', lastDay = '';
  all.slice(start).forEach(function(m){
    var day = fDay.format(dt(m));
    if (day !== lastDay){ html += '<div class="day">'+esc(day)+'</div>'; lastDay = day; }
    html += matchRow(m);
  });

  view.innerHTML = '<button class="more" id="tog">'
      + (showAll ? 'Showing all 20 clubs \u2014 show only ' + esc(team(TEAM).short)
                 : 'Showing ' + esc(team(TEAM).short) + ' only \u2014 show all clubs')
      + '</button>'
      + (start > 0 ? '<button class="more" id="past">\u2191 Show earlier matches</button>'
                   : (showPast && nextIdx > 0 ? '<button class="more" id="past">\u2193 Jump to the next match</button>' : ''))
      + (html || '<p class="sub">No matches.</p>');

  document.getElementById('tog').onclick = function(){ showAll = !showAll; renderFixtures(); };
  var b = document.getElementById('past');
  if (b) b.onclick = function(){ showPast = !showPast; renderFixtures(); window.scrollTo(0, 0); };

  // one click puts the whole season in your calendar app
  var mineList = D.matches.filter(function(m){ return m.h === TEAM || m.a === TEAM; });
  var bar = document.createElement('div');
  var feed = location.origin + location.pathname.replace(/[^/]*$/, '') + 'ics/' + TEAM + '.ics';
  bar.innerHTML = '<a class="cal" id="allics">\uFF0B Download all '+mineList.length+' '
                + esc(team(TEAM).short)+' matches (.ics)</a>'
                + '<a class="cal" href="webcal://'+esc(feed.replace(/^https?:\/\//,''))+'">\ud83d\udd01 Subscribe (auto-updates)</a>'
                + '<span class="olab">A download is a snapshot; a subscription keeps up when TV moves a fixture. '
                + 'Tap any match for lineups, stats, video and a single-match calendar link.</span>';
  view.insertBefore(bar, view.firstChild.nextSibling);
  document.getElementById('allics').onclick = function(){
    downloadICS(mineList, team(TEAM).name + ' 2026/27', 'epl-' + TEAM + '.ics');
  };

  view.onclick = function(ev){
    var pb = ev.target.closest ? ev.target.closest('[data-play]') : null;
    if (pb){ ev.stopPropagation(); playHL(D.matches[+pb.dataset.play]); return; }
    var row = ev.target.closest ? ev.target.closest('.m') : null;
    if (!row || !view.contains(row)) return;
    var m = D.matches[+row.dataset.i];
    var nxt = row.parentNode.classList && row.parentNode.classList.contains('owrap')
              ? row.parentNode.nextSibling : row.nextSibling;
    if (nxt && nxt.className === 'detailbox'){ nxt.parentNode.removeChild(nxt); return; }
    var box = document.createElement('div');
    box.className = 'detailbox';
    var anchor = row.parentNode.classList && row.parentNode.classList.contains('owrap') ? row.parentNode : row;
    anchor.parentNode.insertBefore(box, anchor.nextSibling);
    openDetail(m, box);
  };
}

/* ---------- kickoff times ---------- */
function renderTZ(){
  var mine = D.matches.filter(function(m){ return m.h === TEAM || m.a === TEAM; });
  var hours = new Array(24).fill(0), easy = 0, work = 0, alarm = 0;

  // Three buckets, mutually exclusive, so they sum to the full 38.
  mine.forEach(function(m){
    var d = dt(m), h = d.getHours(), wd = d.getDay();
    hours[h]++;
    var weekday = (wd >= 1 && wd <= 5);
    if (h < 8) alarm++;
    else if (weekday && h < 17) work++;
    else easy++;
  });

  var max = Math.max.apply(null, hours) || 1;
  var bars = hours.map(function(n, h){
    if (!n) return '';
    var lab = fTime.format(new Date(2026, 0, 1, h, 0));
    return '<div class="bar"><div class="h">'+esc(lab)+'</div>'
      + '<div class="t"><div class="f'+(n === max ? '' : ' dim')+'" style="width:'+Math.round(n/max*100)+'%"></div></div>'
      + '<div class="v">'+n+'</div></div>';
  }).join('');

  // name the competitions actually in the count, so the total is never a mystery
  var byComp = {};
  mine.forEach(function(m){ var c = m.c || 'PL'; byComp[c] = (byComp[c] || 0) + 1; });
  var parts = Object.keys(byComp).map(function(c){
    return byComp[c] + ' ' + (c === 'PL' ? 'league' : (COMP[c] || c));
  });
  var comps = parts.length > 1 ? ' (' + parts.join(', ') + ')' : '';

  var t = team(TEAM);
  view.innerHTML =
      '<div class="cards">'
    + '<div class="c"><div class="n">'+easy+'<span style="font-size:17px;color:var(--muted)">/'+mine.length+'</span></div>'
    +   '<div class="l">easy — weekend, or a weeknight after 5pm</div></div>'
    + '<div class="c"><div class="n">'+work+'</div><div class="l">clash with your work day (Mon–Fri, 8–5)</div></div>'
    + '<div class="c"><div class="n">'+alarm+'</div><div class="l">before 8am — set an alarm</div></div>'
    + '</div>'
    + '<div class="bars"><div class="l" style="font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:9px">'
    +   esc(t.short)+' kickoffs by your local time</div>'+bars+'</div>'
    + '<p class="note">All '+mine.length+" of "+esc(t.name)+"'s scheduled matches"+comps+", converted from UK time to <b>"+esc(TZ)+'</b>. '
    + 'The three counts above add up to '+mine.length+' — every match lands in exactly one. '
    + 'UK clocks change on 25 Oct and 28 Mar, so the same 3pm kickoff shifts by an hour for you twice this season; that is already handled here.<br><br>'
    + '<b>Later fixtures are provisional.</b> Broadcasters move matches for TV, usually about five weeks ahead. '
    + 'This page refreshes from the source a few times a day, so those moves flow through as they are announced.</p>';
}

/* ---------- hero: the next match, counting down ---------- */
var heroTimer = null;
function streakText(k){
  var f = formOf(k, 20);
  if (!f.length) return '';
  var last = f[f.length-1], n = 0;
  for (var i = f.length-1; i >= 0 && f[i] === last; i--) n++;
  if (n < 2) return {W:'Won the last one.', D:'Drew the last one.', L:'Lost the last one.'}[last] || '';
  return {W:n+' wins in a row \u2014 keep it going.',
          D:n+' draws in a row.',
          L:n+' straight defeats.'}[last] || '';
}

// ESPN gives Spurs, Fulham and Leeds a primary colour of #ffffff. --club is painted
// behind white text (tabs, scorer counts, the hero gradient), so those clubs rendered
// white-on-white at 1.00:1 — the page effectively vanished. Pick a colour that white
// can sit on: the club's own alternate if it is dark enough, else darken the primary.
function readableClub(col, alt){
  function lum(c){
    c = String(c || '').replace('#', '');
    if (c.length !== 6) return null;
    var v = [0, 2, 4].map(function(i){
      var x = parseInt(c.substr(i, 2), 16) / 255;
      return x <= 0.03928 ? x / 12.92 : Math.pow((x + 0.055) / 1.055, 2.4);
    });
    return 0.2126 * v[0] + 0.7152 * v[1] + 0.0722 * v[2];
  }
  function contrastOnWhiteText(c){ var L = lum(c); return L == null ? 0 : 1.05 / (L + 0.05); }
  if (contrastOnWhiteText(col) >= 3) return col;                 // fine as-is
  var c = String(col || '').replace('#', '');
  if (c.length !== 6) return contrastOnWhiteText(alt) >= 3 ? alt : '#3d195b';
  var ch = [0, 2, 4].map(function(i){ return parseInt(c.substr(i, 2), 16); });
  var sat = Math.max.apply(null, ch) - Math.min.apply(null, ch);
  // If the club actually has a hue, darken THEIR colour — City stays sky blue rather
  // than turning black. Only a white/grey primary (Spurs, Fulham) falls back to the
  // alternate, which is the club's real second colour.
  if (sat < 25 && contrastOnWhiteText(alt) >= 3) return alt;
  for (var f = 0.6; f > 0.15; f -= 0.1){
    var d = '#' + ch.map(function(v){ return ('0' + Math.round(v * f).toString(16)).slice(-2); }).join('');
    if (contrastOnWhiteText(d) >= 3) return d;
  }
  return contrastOnWhiteText(alt) >= 3 ? alt : '#3d195b';
}

function renderHero(){
  var el = document.getElementById('hero');

  document.documentElement.style.setProperty('--club', readableClub(t.col, t.col2));

  var comp = next.c === 'PL' ? 'Premier League \u00b7 Matchday ' + next.md : (COMP[next.c] || next.c);

  el.innerHTML = '<div class="hero'+(live?' livenow':'')+'">'
    + '<div class="lbl">'+(live ? '\u25cf Playing now' : 'Next up for ' + esc(t.short))+'</div>'
    + '<div class="vs">'
    +   '<div class="cl">'+crest(next.h, 1)+'<span>'+esc(team(next.h).short)+'</span></div>'
    +   '<div class="sep">V</div>'
    +   '<div class="cl"><span>'+esc(team(next.a).short)+'</span>'+crest(next.a, 1)+'</div>'
    + '</div>'
    + '<div class="when">'+esc(fDay.format(dt(next)))+' \u00b7 '+esc(fTime.format(dt(next)))+' your time</div>'
    + '<div class="cd" id="cd"></div>'
    + '<div class="tag">'+esc(homeAway)+' \u00b7 '+esc(comp)
    +   (next.tv ? ' \u00b7 \ud83d\udcfa ' + esc(next.tv.join(' / ')) : '')+'</div>'
    + (streak ? '<div class="streak">'+esc(streak)+'</div>' : '')
    + '<button class="go2" id="heroGo" aria-label="Open this match"></button>'
    + '</div>';

  var wxHost = el.querySelector('.tag');
  loadWx(next, function(w){
    // the hero may have been re-rendered for a different club while this was in flight
    if (!w || !wxHost || !wxHost.isConnected) return;
    var d = WXC[w.c] || ['', '\ud83c\udf21\ufe0f'];
    wxHost.insertAdjacentHTML('afterend',
      '<span class="wxh">'+d[1]+' '+w.t+'\u00b0C \u00b7 '+w.p+'% rain at kickoff</span>');
  });

  var cd = document.getElementById('cd');
  function tick(){
    var ms = dt(next).getTime() - Date.now();
    if (live || ms <= 0){
      cd.innerHTML = '<div><b>'+(live ? esc(next.clock || 'LIVE') : 'KICK OFF')+'</b><span>'
                   + (live ? 'in play' : 'under way') + '</span></div>';
      return;
    }
    var s = Math.floor(ms/1000), d = Math.floor(s/86400), h = Math.floor(s%86400/3600),
        mi = Math.floor(s%3600/60), se = s%60;
    cd.innerHTML = [[d,'days'],[h,'hrs'],[mi,'min'],[se,'sec']].map(function(x){
      return '<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>'; }).join('');
  }
  tick();
  heroTimer = setInterval(tick, 1000);

  document.getElementById('heroGo').onclick = function(){
    TAB = 'fix';
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.toggle('on', x.dataset.t === 'fix'); });
    render();
    setTimeout(function(){
      var row = view.querySelector('.m[data-i="'+next._i+'"]');
      if (row){ row.click(); row.scrollIntoView({block:'center'}); }
    }, 30);
  };
}

/* ---------- squads: full club roster, fetched from ESPN on demand ---------- */
var squadCache = {};
var POS_ORDER = [['G','Goalkeepers'],['D','Defenders'],['M','Midfielders'],['F','Forwards']];

function openSquad(k){
  var t = team(k);
  var ov = document.createElement('div');
  ov.className = 'ovl';
  function body(inner){
    ov.innerHTML = '<div class="box" style="max-height:88vh;overflow:auto">'
      + '<div class="bh"><span>'+esc(t.name)+' \u00b7 squad</span>'
      + '<button aria-label="Close">\u00d7</button></div>'
      + '<div class="saybox">'+inner+'</div></div>';
  }
  body('<p class="sub" style="margin:0">Loading squad\u2026</p>');
  function close(){ if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', k2); }
  function k2(e){ if (e.key === 'Escape') close(); }
  ov.onclick = function(e){ if (e.target === ov || e.target.tagName === 'BUTTON') close(); };
  document.addEventListener('keydown', k2);
  document.body.appendChild(ov);

  function draw(list){
    if (!list || !list.length){ body('<p class="sub" style="margin:0">No squad published for this club.</p>'); return; }
    var groups = {};
    list.forEach(function(p){
      var ab = ((p.position || {}).abbreviation || '?')[0];
      (groups[ab] = groups[ab] || []).push(p);
    });
    var html = '<div class="sqgrid">';
    POS_ORDER.forEach(function(g){
      var ps = groups[g[0]];
      if (!ps || !ps.length) return;
      html += '<div class="sqcol"><h5>'+esc(g[1])+' ('+ps.length+')</h5>';
      ps.sort(function(a, b){ return (+a.jersey || 99) - (+b.jersey || 99); }).forEach(function(p){
        html += '<div class="sqp"><span class="no">'+esc(p.jersey || '')+'</span>'
              + '<span>'+esc(p.displayName || '')+'</span>'
              + '<span class="ag">'+(p.age ? p.age : '')+'</span></div>';
      });
      html += '</div>';
    });
    html += '</div><p class="note">Squad from ESPN, loaded when you opened this. '
          + 'Useful before kickoff, when the official XI is not out yet.</p>';
    body(html);
  }

  if (squadCache[k]){ draw(squadCache[k]); return; }
  if (!t.id){ draw(null); return; }
  getJSON('https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/teams/'+t.id+'/roster')
    .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(function(j){
      var a = j.athletes || [];
      var list = (a.length && a[0] && a[0].items) ? a.reduce(function(acc, g){ return acc.concat(g.items || []); }, []) : a;
      squadCache[k] = list; draw(list);
    })
    .catch(function(){ body('<p class="sub" style="margin:0">Couldn\u2019t load the squad \u2014 '
      + 'that\u2019s a network problem, not an empty squad. Try again in a moment.</p>'); });
}

/* ---------- share card: drawn in a canvas, nothing uploaded ---------- */
function shareCard(m){
  var W = 1200, H = 630, c = document.createElement('canvas');
  c.width = W; c.height = H;
  var x = c.getContext('2d');
  var col = team(TEAM).col || '#3d195b';

  var g = x.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, col); g.addColorStop(1, '#191021');
  x.fillStyle = g; x.fillRect(0, 0, W, H);

  x.fillStyle = 'rgba(255,255,255,.85)';
  x.font = '700 26px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
  x.fillText((m.c === 'PL' ? 'PREMIER LEAGUE \u00b7 MATCHDAY ' + m.md : (COMP[m.c] || '')).toUpperCase(), 70, 92);

  var hn = team(m.h).short, an = team(m.a).short;
  x.fillStyle = '#fff';
  x.font = '900 64px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
  x.textAlign = 'left';  x.fillText(hn, 70, 300);
  x.textAlign = 'right'; x.fillText(an, W - 70, 300);

  x.textAlign = 'center';
  if (m.done){
    x.font = '900 96px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
    x.fillText(m.hs + ' \u2013 ' + m['as'], W / 2, 310);
  } else {
    x.font = '800 40px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
    x.fillText('V', W / 2, 292);
    x.fillStyle = 'rgba(255,255,255,.9)';
    x.font = '600 30px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
    x.fillText(fDay.format(dt(m)) + ' \u00b7 ' + fTime.format(dt(m)), W / 2, 380);
  }

  x.fillStyle = 'rgba(255,255,255,.72)';
  x.font = '600 24px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
  if (m.v) x.fillText(m.v, W / 2, m.done ? 400 : 430);
  x.font = '700 22px -apple-system,Segoe UI,Roboto,Helvetica,Arial';
  x.fillText('danpune.github.io/epl-tracker', W / 2, H - 60);

  var name = (hn + '-v-' + an).replace(/[^\w-]/g, '') + '.png';
  c.toBlob(function(blob){
    var file = new File([blob], name, {type: 'image/png'});
    if (navigator.canShare && navigator.canShare({files: [file]})){
      navigator.share({files: [file], title: hn + ' v ' + an}).catch(function(){});
      return;
    }
    var url = URL.createObjectURL(blob), a = document.createElement('a');
    a.href = url; a.download = name; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
  }, 'image/png');
}

/* ---------- highlights: official Premier League uploads, oEmbed-verified ---------- */
function hlKey(m){ return m.e || (m.h + m.a + m.utc); }
function hlFor(m){ return HL && HL[hlKey(m)]; }

function playHL(m){
  var h = hlFor(m);
  var title = team(m.h).short + ' ' + (m.done ? m.hs + '\u2013' + m['as'] : 'v') + ' ' + team(m.a).short;
  if (!h){
    window.open('https://www.youtube.com/results?search_query='
      + encodeURIComponent('Premier League ' + team(m.h).name + ' v ' + team(m.a).name + ' highlights'),
      '_blank', 'noopener');
    return;
  }
  var ov = document.createElement('div');
  ov.className = 'ovl';
  ov.innerHTML = '<div class="box"><div class="bh"><span>\ud83c\udfac '+esc(title)+'</span>'
    + '<button aria-label="Close">\u00d7</button></div>'
    + '<div class="fr"><iframe src="https://www.youtube-nocookie.com/embed/'+esc(h.yt)
    + '?autoplay=1&amp;rel=0" title="Match video" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe></div></div>';
  function close(){ if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener('keydown', esckey); }
  function esckey(e){ if (e.key === 'Escape') close(); }
  ov.onclick = function(e){ if (e.target === ov || e.target.tagName === 'BUTTON') close(); };
  document.addEventListener('keydown', esckey);
  document.body.appendChild(ov);
}

function renderHighlights(){
  if (!HL){
    view.innerHTML = '<p class="sub">Loading highlights\u2026</p>';
    return;
  }
  var done = D.matches.filter(function(m){ return m.done && hlFor(m); })
                      .sort(function(a, b){ return a.utc < b.utc ? 1 : a.utc > b.utc ? -1 : 0; });
  if (!done.length){
    if (HL.__failed){
      view.innerHTML = '<div class="saybox"><b>Couldn\u2019t load the highlights list.</b>'
        + '<div class="fine">That\u2019s a network problem, not an empty list. Reload to try again.</div></div>';
      return;
    }
    view.innerHTML = '<div class="saybox"><b>No official video yet.</b>'
      + '<div class="fine">Clips appear here as the Premier League posts them after each match. '
      + 'In the meantime, any finished match has a \u25b6 that opens a YouTube search.</div></div>';
    return;
  }
  var html = '', lastDay = '';
  done.forEach(function(m){
    var h = hlFor(m), day = fDay.format(dt(m));
    if (day !== lastDay){ html += '<div class="hlday">'+esc(day)+'</div>'; lastDay = day; }
    html += '<div class="hlc" data-i="'+m._i+'" tabindex="0" role="button" aria-label="'
      + esc('Play video: '+team(m.h).short+' '+m.hs+'-'+m['as']+' '+team(m.a).short)+'">'
      + '<div class="hlthumb"><img loading="lazy" src="https://i.ytimg.com/vi/'+esc(h.yt)+'/hqdefault.jpg" alt="">'
      +   '<span class="hlplay">\u25b6</span></div>'
      + '<div class="hls">'+crest(m.h)+'<span>'+esc(team(m.h).short)+' '+m.hs+'\u2013'+m['as']+' '
      +   esc(team(m.a).short)+'</span></div>'
      + '<div class="hlt">'+esc(h.t)+(h.round ? '<span class="rnd">round-up</span>' : '')+'</div>'
      + '</div>';
  });
  view.innerHTML = '<div class="hlgrid">'+html+'</div>'
    + '<p class="note">Official uploads from the Premier League\u2019s own YouTube channel, each one '
    + 'verified against the channel before it is shown. The league does not post full match-highlight '
    + 'reels worldwide, so some matches show the matchweek round-up instead. Playing a clip contacts '
    + 'YouTube (no-cookie domain); nothing else on this page does.</p>';
  view.onclick = function(ev){
    var c = ev.target.closest ? ev.target.closest('.hlc') : null;
    if (c) playHL(D.matches[+c.dataset.i]);
  };
}

/* ---------- live scores, straight from ESPN ---------- */
// GitHub throttles scheduled workflows on low-traffic repos: the cron asks for every
// 30 minutes and actually gets ~3.4 hours. That is fine for fixtures and the table,
// but it is not live. ESPN's scoreboard is CORS-open, so on match days the page
// refreshes scores itself and does not wait for the next commit.
var liveTimer = null;

function liveWindow(){
  var now = Date.now(), comps = {};
  D.matches.forEach(function(m){
    var t = dt(m).getTime();
    // `|| m.live` is what makes this self-healing: a stale live flag from an older
    // commit keeps its competition in the poll set until ESPN says the match is over.
    if ((t > now - 4 * 3600e3 && t < now + 3600e3) || m.live) comps[m.c || 'PL'] = true;
  });
  return Object.keys(comps);
}

function applyLive(events){
  var byId = {}, changed = false;
  D.matches.forEach(function(m){ if (m.e) byId[m.e] = m; });
  events.forEach(function(e){
    var m = byId[String(e.id || '')];
    if (!m) return;
    var c = (e.competitions || [{}])[0], st = (c.status || {}).type || {};
    var cs = c.competitors || [];
    var home = cs.filter(function(x){ return x.homeAway === 'home'; })[0];
    var away = cs.filter(function(x){ return x.homeAway === 'away'; })[0];
    if (!home || !away || st.state === 'pre') return;          // never trust a pre-match "0"
    var hs = /^\d+$/.test(String(home.score)) ? +home.score : null;
    var as = /^\d+$/.test(String(away.score)) ? +away.score : null;
    var live = st.state === 'in', done = !!st.completed;
    var clock = live ? (st.shortDetail || '') : '';
    if (m.hs !== hs || m['as'] !== as || !!m.live !== live || !!m.done !== done || m.clock !== clock){
      m.hs = hs; m['as'] = as; m.done = done; m.clock = clock;
      if (live) m.live = true; else delete m.live;
      changed = true;
    }
  });
  return changed;
}

function pollLive(){
  var comps = liveWindow();
  if (!comps.length){ liveTimer = setTimeout(pollLive, 15 * 60e3); return; }   // nothing on; check back later
  var day = function(off){
    var d = new Date(Date.now() + off * 86400e3);
    return d.getUTCFullYear() + ('0'+(d.getUTCMonth()+1)).slice(-2) + ('0'+d.getUTCDate()).slice(-2);
  };
  var range = day(-1) + '-' + day(1);                       // covers every timezone edge
  Promise.all(comps.map(function(c){
    var path = (D.paths || {})[c] || 'eng.1';
    return getJSON('https://site.api.espn.com/apis/site/v2/sports/soccer/'+path+'/scoreboard?dates='+range+'&limit=200')
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.events) || []; })
      .catch(function(){ return []; });
  })).then(function(lists){
    var evs = lists.reduce(function(a, b){ return a.concat(b); }, []);
    if (applyLive(evs)){
      // keep the open match panel across the refresh — the detail is cached, so
      // reopening is instant, and losing it every 60s during a match is the worst
      // possible moment to lose it.
      var openRow = view.querySelector('.detailbox');
      var openIdx = openRow && openRow.previousSibling
                  ? (openRow.previousSibling.querySelector
                      ? (openRow.previousSibling.querySelector('.m') || openRow.previousSibling).dataset.i
                      : null)
                  : null;
      render();
      if (openIdx != null){
        var row = view.querySelector('.m[data-i="' + openIdx + '"]');
        if (row) row.click();
      }
    }
    var anyLive = D.matches.some(function(m){ return m.live; });
    liveTimer = setTimeout(pollLive, anyLive ? 60e3 : 5 * 60e3);
  }).catch(function(){
    liveTimer = setTimeout(pollLive, 60e3);      // never let one throw end live scores
  });
}

// Enter/Space activate anything we made role="button" — one listener for all of them.
document.addEventListener('keydown', function(e){
  if (e.key !== 'Enter' && e.key !== ' ') return;
  var t = e.target;
  if (!t || !t.closest) return;
  if (t.closest('.m,[data-squad],.hlc')){ e.preventDefault(); t.click(); }
});

/* ---------- season progress: where are we in the 9-month season ---------- */
function renderSeason(){
  var el = document.getElementById('season');
  var lg = D.matches.filter(function(m){ return m.c === 'PL'; }).slice()
            .sort(function(a, b){ return a.utc < b.utc ? -1 : a.utc > b.utc ? 1 : 0; });
  if (!lg.length){ el.innerHTML = ''; return; }

  var first = dt(lg[0]), last = dt(lg[lg.length - 1]), now = Date.now();
  var playedLg = lg.filter(function(m){ return m.done; }).length;
  var mine = D.matches.filter(function(m){ return m.h === TEAM || m.a === TEAM; });
  var minePlayed = mine.filter(function(m){ return m.done; }).length;

  // Progress by TIME, not by matches: fixtures bunch up, so a match count misreads
  // where you actually are in the calendar.
  var pct = Math.max(0, Math.min(100,
    (now - first.getTime()) / (last.getTime() - first.getTime()) * 100));
  var monthsLeft = (last.getTime() - now) / (1000 * 60 * 60 * 24 * 30.44);
  var t = team(TEAM);
  var fmt = new Intl.DateTimeFormat([], {day:'numeric', month:'short', year:'numeric'});
  var left = monthsLeft <= 0 ? 'season over'
           : monthsLeft < 1 ? Math.max(1, Math.round(monthsLeft * 30.44)) + ' days remaining'
           : monthsLeft.toFixed(1).replace(/\.0$/, '') + ' months remaining';

  el.innerHTML = '<div class="season">'
    + '<div class="sl"><span>Season <b>' + esc(fmt.format(first)) + '</b> \u2192 <b>'
    +   esc(fmt.format(last)) + '</b></span>'
    +   '<span>' + esc(left) + '</span></div>'
    + '<div class="track"><div class="fill" style="width:' + pct.toFixed(1) + '%"></div></div>'
    + '<div class="foot">'
    +   '<span>' + esc(t.short) + ' have played <b>' + minePlayed + '</b> of <b>'
    +     mine.length + '</b> matches \u00b7 <b>' + (mine.length - minePlayed)
    +     '</b> matches left</span>'
    +   '<span>league: ' + playedLg + ' of ' + lg.length + ' played</span>'
    + '</div></div>';
}

/* ---------- shell ---------- */
function render(){
  view.onclick = null;          // drop the previous tab's delegated handler
  renderHero();
  renderSeason();
  if (TAB === 'table') renderTable();
  else if (TAB === 'fix') renderFixtures();
  else if (TAB === 'hl') renderHighlights();
  else if (TAB === 'about') renderAbout();
  else renderTZ();
}

document.querySelectorAll('nav button').forEach(function(b){
  b.onclick = function(){
    document.querySelectorAll('nav button').forEach(function(x){ x.classList.remove('on'); });
    b.classList.add('on'); TAB = b.dataset.t; render();
  };
});

// Data files are rewritten every ~30 minutes. Without this a returning visitor is
// served yesterday's scores out of the browser cache. ?t= defeats proxies that
// ignore no-store.
function getJSON(path){
  return fetch(path + (path.indexOf('?') > -1 ? '&' : '?') + 't=' + Date.now(),
               {cache: 'no-store'});
}

getJSON('highlights.json').then(function(r){ return r.ok ? r.json() : null; })
  .then(function(j){ HL = (j && j.highlights) || {}; if (D) render(); })
  .catch(function(){ HL = {}; HL.__failed = true; if (D) render(); });

getJSON('scorers.json').then(function(r){ return r.ok ? r.json() : null; })
  .then(function(s){ SCORERS = s; if (D && TAB === 'table') render(); })
  .catch(function(){});

getJSON('data.json').then(function(r){ return r.json(); }).then(function(d){
  D = d;
  var sel = document.getElementById('team');
  // validate against the TABLE, not the team map — the map also holds cup opponents,
  // so a relegated club passes and the picker then has no matching option
  if (!D.table.some(function(r){ return r.t === TEAM; })){
    TEAM = D.table[0].t;
    try { localStorage.setItem('epl.team', TEAM); } catch (e) {}
  }
  sel.innerHTML = D.table.slice().sort(function(a,b){
      return team(a.t).name.localeCompare(team(b.t).name); })
    .map(function(r){ return '<option value="'+r.t+'"'+(r.t===TEAM?' selected':'')+'>'+esc(team(r.t).name)+'</option>'; }).join('');
  sel.onchange = function(){ TEAM = sel.value; localStorage.setItem('epl.team', TEAM); showAll = false; showPast = false; render(); };

  D.matches.forEach(function(m, i){ m._i = i; });
  var lg = D.matches.filter(function(m){ return m.c === 'PL'; });
  var played = lg.filter(function(m){ return m.done; }).length;
  document.getElementById('sub').textContent = D.season + ' season · ' + D.table.length
    + ' clubs · ' + lg.length + ' matches · 38 each';
  document.getElementById('tz').textContent = 'Times in ' + TZ;
  document.getElementById('upd').textContent = 'Updated ' + new Date(D.updated).toLocaleString();
  render();
  pollLive();
}).catch(function(e){
  document.getElementById('sub').textContent = '';
  document.querySelector('.picker').style.display = 'none';
  document.getElementById('hero').innerHTML = '';
  view.innerHTML = '<div class="err"><b>Could not load the data.</b><br>'
    + 'The site\u2019s data file didn\u2019t load. Reload the page \u2014 if it keeps happening the '
    + 'last update probably failed.</div>';
  if (window.console) console.error(e);
});
</script>
